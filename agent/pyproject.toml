[project]
name = "minimax-code-agent"
version = "0.3.2"
description = "MiniMax Code Python agent — JSON-RPC 2.0 over HTTP/WS + stdio"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "MiniMax Code Team" },
]
dependencies = [
    # Phase 1 (skeleton only — these are listed for future tasks, not yet imported):
    "pydantic>=2.7",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "apscheduler>=3.10",
    "platformdirs>=4.0",  # cross-platform user data dir resolution
    "keyring>=24",  # OS keyring storage for the MiniMax API key (env var fallback)
    # v0.2.0 web transport — HTTP + WebSocket bridge replacing the
    # Tauri sidecar. FastAPI ships its own WebSocket support
    # (Starlette under the hood), so no extra ``websockets``
    # package is required.
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "anthropic>=0.105.2",
    # v0.4.0 dual-protocol: OpenAI-compatible transport for 智谱/DeepSeek/etc.
    "openai>=1.30",
    # v0.6.0 live preview — file-system watcher for hot-reload
    "watchfiles>=0.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "httpx>=0.27",  # already a runtime dep; pinned here so the test transport is always present
]

[project.scripts]
minimax-code-agent = "minimax_code.__main__:cli_entry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["minimax_code"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
