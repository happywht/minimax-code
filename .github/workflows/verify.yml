name: Verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  # Let the current run finish so frequent pushes do not erase all evidence;
  # GitHub retains the latest pending run in the same concurrency group.
  cancel-in-progress: false

jobs:
  baseline:
    name: Baseline (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.8'
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen --extra dev --extra attachments
        working-directory: agent
      - name: Verify Linux service upgrade orchestration
        run: uv run --frozen --extra dev pytest -q ../scripts/tests/test_upgrade_linux_user_service.py
        working-directory: agent
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm verify:attachments
      - run: pnpm verify:baseline
      - name: Save evidence (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-${{ matrix.os }}
          include-hidden-files: true
          path: |
            .verification/
            playwright-report/
            test-results/
            e2e/.runtime/**/*.log

  backend-full:
    name: Full backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.8'
      - run: uv sync --frozen --extra dev --extra attachments
        working-directory: agent
      - run: node scripts/verify.mjs --suite=full
      - name: Save backend evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-full-${{ matrix.os }}
          include-hidden-files: true
          path: .verification/

  minimum-python:
    name: Minimum Python 3.11 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.8'
      - run: uv sync --frozen --extra dev
        working-directory: agent
      - name: Verify streaming context on minimum supported Python
        run: >-
          uv run --no-sync pytest -q
          tests/test_stream_context.py
          tests/test_agent_core.py
          tests/test_agent_cancel.py
          tests/test_cancel.py
          tests/test_budget_transport.py
          tests/test_agent_skill_bindings.py
          tests/test_reliability.py
          --junitxml=../.verification/minimum-python.xml
        working-directory: agent
      - name: Save minimum Python evidence (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimum-python-${{ matrix.os }}
          include-hidden-files: true
          path: .verification/minimum-python.xml
